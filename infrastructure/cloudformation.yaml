AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS Student Submission Portal - Complete Infrastructure (VPC, EC2, RDS PostgreSQL, S3, IAM, CloudWatch)'

Parameters:
  EnvironmentName:
    Type: String
    Default: 'production'
    Description: 'Deployment environment name'

  KeyName:
    Type: String
    Default: ''
    Description: 'Optional: Name of an existing EC2 KeyPair for SSH access (leave empty if using browser-based EC2 Instance Connect)'

  LatestUbuntuAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id'
    Description: 'SSM Parameter path for latest official Ubuntu 22.04 LTS AMI (auto-resolves in any AWS region)'

  DBUsername:
    Type: String
    Default: 'dbadmin'
    Description: 'Master database username for Amazon RDS'

  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: 'Master database password for Amazon RDS PostgreSQL'
    Default: 'PortalSecurePass2026!'

  InstanceType:
    Type: String
    Default: 't3.micro'
    AllowedValues:
      - 't3.micro'
      - 't3.small'
      - 't2.micro'
    Description: 'EC2 Instance Type (t3.micro is AWS Free Tier eligible)'

  DBBackupRetentionPeriod:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 35
    Description: 'Automated backup retention days (AWS Free Tier allows max 1 day; set to 0 to disable backups)'

Conditions:
  HasKeyName: !Not [!Equals [!Ref KeyName, '']]

Resources:
  # =========================================================================
  # 1. NETWORKING (VPC, Subnets, Internet Gateway)
  # =========================================================================
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: '10.0.0.0/16'
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-student-portal-vpc'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-igw'

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: '10.0.1.0/24'
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-public-subnet-1'

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: '10.0.2.0/24'
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-public-subnet-2'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-public-rt'

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId: !Ref InternetGateway

  SubnetRouteAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  SubnetRouteAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # =========================================================================
  # 2. AMAZON S3 STORAGE (Private Bucket with SSE and CORS)
  # =========================================================================
  SubmissionS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'aws-student-submission-portal-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: 'AES256'
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: ['GET', 'PUT', 'POST', 'HEAD']
            AllowedOrigins: ['*']
            MaxAge: 3600
      Tags:
        - Key: Project
          Value: 'StudentSubmissionPortal'

  # =========================================================================
  # 3. AMAZON CLOUDWATCH LOG GROUP
  # =========================================================================
  PortalLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: '/aws/student-portal'
      RetentionInDays: 30

  # =========================================================================
  # 4. AWS IAM ROLE & INSTANCE PROFILE
  # =========================================================================
  AppInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-StudentPortal-EC2Role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: [ec2.amazonaws.com]
            Action: ['sts:AssumeRole']
      Policies:
        - PolicyName: S3SubmissionAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3:PutObject'
                  - 's3:GetObject'
                  - 's3:DeleteObject'
                  - 's3:ListBucket'
                Resource:
                  - !GetAtt SubmissionS3Bucket.Arn
                  - !Sub '${SubmissionS3Bucket.Arn}/*'
        - PolicyName: CloudWatchLogsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                  - 'logs:DescribeLogStreams'
                Resource: !Sub '${PortalLogGroup.Arn}:*'

  AppInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref AppInstanceRole]

  # =========================================================================
  # 5. SECURITY GROUPS
  # =========================================================================
  WebServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: 'Allow HTTP, HTTPS, and SSH access to EC2 instance'
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: '0.0.0.0/0'
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: '0.0.0.0/0'
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: '0.0.0.0/0'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-web-sg'

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: 'Allow PostgreSQL traffic strictly from EC2 Web Server SG'
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref WebServerSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-rds-sg'

  # =========================================================================
  # 6. AMAZON RDS POSTGRESQL DATABASE
  # =========================================================================
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: 'Subnets for PostgreSQL RDS instance'
      SubnetIds: [!Ref PublicSubnet1, !Ref PublicSubnet2]

  PostgresRDSInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      AllocatedStorage: 20
      DBInstanceClass: 'db.t4g.micro'
      Engine: 'postgres'
      EngineVersion: '16.3'
      DBName: 'student_portal'
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      MultiAZ: false
      PubliclyAccessible: false
      StorageType: 'gp3'
      BackupRetentionPeriod: !Ref DBBackupRetentionPeriod
      DeleteAutomatedBackups: true
      DeletionProtection: false
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-rds-postgres'

  # =========================================================================
  # 7. AMAZON EC2 INSTANCE (HOSTING NODE.JS + NGINX)
  # =========================================================================
  AppEC2Instance:
    Type: AWS::EC2::Instance
    DependsOn: PostgresRDSInstance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestUbuntuAmiId
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref 'AWS::NoValue']
      SubnetId: !Ref PublicSubnet1
      SecurityGroupIds: [!Ref WebServerSecurityGroup]
      IamInstanceProfile: !Ref AppInstanceProfile
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-student-portal-ec2'

Outputs:
  EC2PublicIP:
    Description: 'Public IP address of the EC2 Web Server'
    Value: !GetAtt AppEC2Instance.PublicIp

  S3BucketName:
    Description: 'Amazon S3 Bucket for Submissions and Reference Materials'
    Value: !Ref SubmissionS3Bucket

  RDSEndpoint:
    Description: 'PostgreSQL RDS Database Connection Endpoint'
    Value: !GetAtt PostgresRDSInstance.Endpoint.Address

  CloudWatchLogGroup:
    Description: 'CloudWatch Logs Group Name'
    Value: !Ref PortalLogGroup
