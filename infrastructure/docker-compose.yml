version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: student_portal_postgres
    restart: always
    environment:
      POSTGRES_USER: dbadmin
      POSTGRES_PASSWORD: PortalSecurePass2026!
      POSTGRES_DB: student_portal
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dbadmin -d student_portal']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: ../infrastructure/Dockerfile.backend
    container_name: student_portal_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_TYPE: postgres
      DATABASE_URL: postgresql://dbadmin:PortalSecurePass2026!@postgres:5432/student_portal
      USE_LOCAL_STORAGE: 'true'
      ADMIN_EMAIL: admin@portal.edu
      ADMIN_PASSWORD: AdminPassword123!
    ports:
      - '5000:5000'
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ../frontend
      dockerfile: ../infrastructure/Dockerfile.frontend
    container_name: student_portal_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - '80:80'

volumes:
  pgdata:
  uploads_data:
